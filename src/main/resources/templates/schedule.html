<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule</title>
  </head>
  <body>
    <h1>Ashburn Panthers Schedule</h1>
    <h2 th:text="${season.year}">Season</h2>
    <table>
      <thead>
        <tr>
          <th>Week</th>
          <th>Opponent</th>
          <th>Location</th>
          <th>Score</th>
          <th>Result</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="game : ${games}">
          <td th:text="${game.week}">Week</td>
          <td th:text="${game.opponent}">Opponent</td>
          <td th:text="${game.location}">Location</td>
          <td
            th:text="${game.result.name() == 'SCHEDULED' ? '—' : game.ourScore + ' - ' + game.opponentScore}"
          >
            Score
          </td>
          <td th:text="${game.result}">Result</td>
          <td>
            <form
              th:if="${game.result.name() == 'SCHEDULED'}"
              action="/schedule/result"
              method="post"
            >
              <input type="hidden" name="gameId" th:value="${game.ID}" />
              <input type="number" name="ourScore" />
              <input type="number" name="opponentScore" />
              <button type="submit">Submit</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
